user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    set_real_ip_from __VPC_CIDR__;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=chat:10m rate=12r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 300s;

    access_log /var/log/nginx/access.log;

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        location = /healthz {
            access_log off;
            proxy_pass http://127.0.0.1:8000;
        }

        location /api/chat {
            limit_req zone=chat burst=6 nodelay;
            limit_conn perip 4;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://127.0.0.1:8000;
        }

        location /api/bench {
            limit_conn perip 2;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_pass http://127.0.0.1:8000;
        }

        location / {
            limit_req zone=general burst=40 nodelay;
            limit_conn perip 20;
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
