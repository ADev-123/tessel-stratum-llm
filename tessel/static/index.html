<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tessel Stratum</title>
<style>
:root{--bg:#f5f7fa;--side:#eceff4;--panel:#fff;--text:#151922;--muted:#566075;--faint:#8590a3;--line:#dbe1ea;--hover:#e3e8f0;--accent:#0d9488;--accent-ink:#fff;--user:#dff3f1;--code:#edf0f5;--good:#15803d;--warn:#b45309;--bad:#dc2626;--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 28px rgba(15,23,42,.08);--fs:15.5px}
[data-theme=dark]{--bg:#0f1217;--side:#12161c;--panel:#171b22;--text:#e7eaf0;--muted:#8a93a6;--faint:#5f687b;--line:#232935;--hover:#1c222b;--accent:#4fe3c5;--accent-ink:#04211b;--user:#17303a;--code:#0b0e13;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:var(--fs)/1.6 -apple-system,"Segoe UI",system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;color:var(--text)}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.serif{font-family:ui-serif,Georgia,"Times New Roman",serif}
.app{display:grid;grid-template-columns:var(--sw,288px) 1fr;height:100vh;overflow:hidden}
.app.collapsed{--sw:0px}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.app.collapsed aside{border-right:0}
.sbtop{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px 18px}
.brand{font-size:18px;letter-spacing:.2px;font-weight:650;font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
.brand b{color:var(--accent);font-weight:700}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--muted)}
.iconbtn:hover:not(:disabled){background:var(--hover);color:var(--text)}
.newchat{display:flex;align-items:center;gap:8px;margin:6px 12px;padding:9px 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:550}
.newchat:hover{filter:brightness(1.06)}
.search{position:relative;margin:4px 12px 8px}
.search svg{position:absolute;left:10px;top:9px;color:var(--faint)}
.search input{width:100%;background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 10px 7px 32px;outline:none}
.search input:focus{border-color:var(--faint)}
.list{flex:1;overflow:auto;padding:0 8px}
.lhead{font-size:12px;color:var(--faint);padding:10px 10px 4px}
.item{display:flex;align-items:center;gap:4px;padding:7px 8px 7px 10px;border-radius:9px;cursor:pointer;color:var(--muted)}
.item:hover{background:var(--hover);color:var(--text)}
.item.active{background:var(--hover);color:var(--text)}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .acts{display:none;gap:0}
.item:hover .acts,.item.active .acts{display:flex}
.item .iconbtn{width:24px;height:24px}
.item input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--faint);border-radius:6px;padding:2px 6px;outline:none}
.sbfoot{display:flex;align-items:center;gap:2px;padding:10px 12px;border-top:1px solid var(--line)}
.sbfoot .sp{flex:1}
.sbfoot .lbl{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px}
.sbfoot .lbl:hover{background:var(--hover);color:var(--text)}
main{display:flex;flex-direction:column;min-width:0;height:100vh;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:52px}
.title{flex:1;min-width:0;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:8px;padding:4px 8px;cursor:text}
.title:hover{background:var(--hover)}
.title-input{flex:1;min-width:0;font-weight:550;background:var(--panel);border:1px solid var(--faint);border-radius:8px;padding:4px 8px;outline:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:var(--panel);max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill:hover{border-color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
.dot.ready{background:var(--good)}
.dot.loading,.dot.waiting{background:var(--warn);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
#thread{flex:1;overflow:auto;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto;padding:12px 22px 28px}
.empty{max-width:760px;margin:0 auto;padding:13vh 22px 0;text-align:center}
.empty h1{font-size:38px;font-weight:400;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 26px}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.sugg button{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel);color:var(--muted);text-align:left;line-height:1.4}
.sugg button:hover{border-color:var(--faint);color:var(--text)}
.msg{margin:18px 0;position:relative}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--user);border-radius:18px;padding:9px 16px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.msg.assistant{display:flex;gap:14px}
.avatar{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font:700 14px -apple-system,"Segoe UI",system-ui,sans-serif;flex:none;margin-top:1px}
.abody{flex:1;min-width:0}
.prose{word-wrap:break-word}
.prose p{margin:0 0 .85em}
.prose p:last-child{margin-bottom:0}
.prose h2,.prose h3,.prose h4,.prose h5{margin:1.1em 0 .4em;line-height:1.3}
.prose ul,.prose ol{margin:0 0 .85em;padding-left:1.4em}
.prose code{background:var(--code);padding:1px 6px;border-radius:5px;font:.88em ui-monospace,Menlo,Consolas,monospace}
.prose pre{background:var(--code);border:1px solid var(--line);border-radius:12px;margin:.6em 0 .9em;overflow:hidden}
.prose pre .ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.prose pre .ch button{color:var(--muted);font-size:12px}
.prose pre .ch button:hover{color:var(--text)}
.prose pre code{display:block;background:none;padding:12px 14px;overflow:auto;white-space:pre}
.prose a{color:var(--accent)}
.think{margin-bottom:.7em;color:var(--muted);font-size:.93em}
.think summary{cursor:pointer;color:var(--faint)}
.think div{white-space:pre-wrap;padding:6px 0 0 10px;border-left:2px solid var(--line);margin-top:6px}
.mline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--faint);min-height:26px}
.mline .acts{display:flex;gap:0;margin-left:-6px}
.mline .iconbtn{width:26px;height:26px}
.mline span.m{white-space:nowrap}
.user .mline{justify-content:flex-end}
.msg.user{flex-direction:column;align-items:flex-end}
.msg.user .mline{opacity:0}
.msg.user:hover .mline{opacity:1}
.live{margin-top:10px}
.bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.livetxt{margin-top:6px;font-size:12.5px;color:var(--faint)}
.errtxt{color:var(--bad);font-size:13.5px;margin-top:6px}
.note{font-size:12.5px;color:var(--faint);margin-top:6px}
.editbox{width:100%;max-width:640px}
.editbox textarea{width:100%;min-height:90px;background:var(--panel);border:1px solid var(--faint);border-radius:14px;padding:10px 14px;outline:none;resize:vertical}
.editbox .row{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 14px}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:550}
.btn.danger{color:var(--bad)}
.composer{padding:0 22px 14px}
.cbox{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:10px 12px 10px 18px;display:flex;align-items:flex-end;gap:10px}
.cbox:focus-within{border-color:var(--faint)}
.cbox textarea{flex:1;border:0;background:none;outline:none;resize:none;max-height:200px;min-height:26px;line-height:1.5;padding:4px 0}
.send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.send:disabled{background:var(--line);color:var(--faint);opacity:1}
.send.stop{background:var(--text);color:var(--bg)}
.cmeta{max-width:760px;margin:6px auto 0;display:flex;justify-content:space-between;font-size:12px;color:var(--faint);padding:0 8px}
.menu{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;min-width:170px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px}
.menu button:hover{background:var(--hover)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13.5px;z-index:50;box-shadow:var(--shadow)}
.drop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:40;color:#fff;font-size:20px}
.drop.on{display:flex}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;z-index:35;padding:20px}
.scrim.on{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(860px,100%);height:min(640px,100%);display:grid;grid-template-columns:200px 1fr;overflow:hidden}
.mnav{background:var(--side);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.mnav h2{font-size:16px;margin:2px 10px 12px;font-weight:600}
.mnav button{text-align:left;padding:8px 10px;border-radius:9px;color:var(--muted)}
.mnav button.on{background:var(--hover);color:var(--text)}
.mnav button:hover{color:var(--text)}
.mpane{padding:20px 26px;overflow:auto;position:relative}
.mpane .x{position:absolute;right:14px;top:12px}
.mpane h3{margin:0 0 14px;font-size:17px}
.mpane h4{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.field{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.field>div:first-child{min-width:0}
.field .d{font-size:13px;color:var(--muted)}
.field.col2{flex-direction:column;align-items:stretch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:5px 14px;color:var(--muted)}
.seg button.on{background:var(--hover);color:var(--text)}
.mpane input[type=text],.mpane input[type=password],.mpane input[type=number],.mpane textarea,.mpane select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;outline:none}
.mpane input:focus,.mpane textarea:focus,.mpane select:focus{border-color:var(--faint)}
.mpane input[type=range]{width:200px;accent-color:var(--accent)}
.mpane input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.rowg{display:flex;gap:8px;align-items:center}
.rowg>*{flex:1}
.rowg>button{flex:none}
.node{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13.5px}
.node .r{margin-left:auto;color:var(--faint);font-variant-numeric:tabular-nums}
.setbox{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px;background:var(--panel)}
.setbox .sh{display:flex;justify-content:space-between;font-weight:550;margin-bottom:4px}
.kv{font-size:13px;color:var(--muted)}
.mcard{cursor:pointer;margin-top:8px;padding:8px 12px}
.mcard.sel{border-color:var(--accent)}
.mcard .sh{margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
td,th{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--faint);font-weight:500}
.pre{white-space:pre-wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;inset:0 auto 0 0;width:288px;z-index:20;transform:translateX(-100%);transition:transform .2s}
 .app:not(.collapsed) aside{transform:none;box-shadow:var(--shadow)}
 .app.collapsed aside{transform:translateX(-100%)}
 .sugg{grid-template-columns:1fr}
 .modal{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .mnav{flex-direction:row;overflow:auto;padding:10px}
 .mnav h2{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
<aside>
  <div class="sbtop">
    <div class="brand serif">Tessel <b>Stratum</b></div>
    <button class="iconbtn" id="collapse" aria-label="Hide sidebar" title="Hide sidebar"></button>
  </div>
  <button class="newchat" id="newchat"></button>
  <div class="search"><span id="searchico"></span><input id="search" type="text" placeholder="Search chats" aria-label="Search chats"></div>
  <div class="list" id="list"></div>
  <div class="sbfoot">
    <button class="iconbtn" id="settingsBtn" aria-label="Settings" title="Settings"></button>
    <span class="sp"></span>
    <button class="lbl" id="importBtn"></button>
    <button class="lbl" id="exportAll"></button>
  </div>
</aside>
<main>
  <div class="top">
    <button class="iconbtn" id="expand" aria-label="Show sidebar" title="Show sidebar" style="display:none"></button>
    <div class="title" id="title"></div>
    <button class="iconbtn" id="exportOne" aria-label="Download this chat" title="Download this chat"></button>
    <button class="pill" id="pill"><span class="dot" id="pdot"></span><span id="ptxt">connecting</span></button>
  </div>
  <div id="thread"></div>
  <div class="composer">
    <div class="cbox">
      <textarea id="input" rows="1" placeholder="Message the cluster" aria-label="Message"></textarea>
      <button class="send" id="send" aria-label="Send"></button>
    </div>
    <div class="cmeta"><span id="ctxinfo"></span><span id="busyinfo"></span></div>
  </div>
</main>
</div>

<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-label="Settings">
    <div class="mnav">
      <h2>Settings</h2>
      <button data-tab="general" class="on">General</button>
      <button data-tab="gen">Generation</button>
      <button data-tab="cluster">Cluster</button>
      <button data-tab="data">Data and privacy</button>
    </div>
    <div class="mpane" id="mpane"><button class="iconbtn x" id="closeSettings" aria-label="Close"></button><div id="tabbody"></div></div>
  </div>
</div>
<div class="drop" id="drop">Drop chat files to import</div>
<input type="file" id="file" accept=".json,application/json" multiple hidden>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ICONS = {
  plus: '<path d="M8 3v10M3 8h10"/>', search: '<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',
  gear: '<path d="M12.8 6.5 L14.6 7.0 L14.6 9.0 L12.8 9.5 L12.4 10.3 L13.4 11.9 L11.9 13.4 L10.3 12.4 L9.5 12.8 L9.0 14.6 L7.0 14.6 L6.5 12.8 L5.7 12.4 L4.1 13.4 L2.6 11.9 L3.6 10.3 L3.2 9.5 L1.4 9.0 L1.4 7.0 L3.2 6.5 L3.6 5.7 L2.6 4.1 L4.1 2.6 L5.7 3.6 L6.5 3.2 L7.0 1.4 L9.0 1.4 L9.5 3.2 L10.3 3.6 L11.9 2.6 L13.4 4.1 L12.4 5.7Z"/><circle cx="8" cy="8" r="2.1"/>',
  send: '<path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/>', stop: '<rect x="4.5" y="4.5" width="7" height="7" rx="1.5" fill="currentColor"/>',
  copy: '<rect x="5.5" y="5.5" width="7.5" height="7.5" rx="1.5"/><path d="M3 10V4.5A1.5 1.5 0 0 1 4.5 3H10"/>',
  edit: '<path d="M3 13l.7-3L10.5 3.2a1.4 1.4 0 0 1 2 2L5.7 12.3z"/>',
  trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8h5.8l.6-8"/>',
  down: '<path d="M8 3v7M5 7.5L8 10.5 11 7.5M3 13h10"/>', up: '<path d="M8 10.5V3.5M5 6L8 3l3 3M3 13h10"/>',
  side: '<rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M6.5 3v10"/>', redo: '<path d="M13 8a5 5 0 1 1-1.5-3.5M13 3v3h-3"/>',
  x: '<path d="M4 4l8 8M12 4l-8 8"/>', check: '<path d="M3.5 8.5L6.5 11.5 12.5 4.5"/>', md: '<path d="M3 12V4l3 4 3-4v8M11 7l2 2 2-2M13 9V5" transform="translate(-1 0)"/>'
};
const icon = (n, size) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 16 16'); s.innerHTML = ICONS[n]; if (size) { s.style.width = s.style.height = size + 'px'; } return s; };
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return e;
};
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const fmtS = ms => ms == null ? '-' : (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + ' s';
const tm = ts => new Date(ts).toISOString().slice(0, 10);

const DEFAULTS = {theme: 'dark', remember: false, size: 'normal', maxTokens: 256, temperature: 0.7, thinking: false, system: '', trim: true};
let settings = {...DEFAULTS, ...JSON.parse(localStorage.getItem('tessel.settings') || '{}')};
const saveSettings = () => localStorage.setItem('tessel.settings', JSON.stringify(settings));
const store = () => settings.remember ? localStorage : sessionStorage;
let chats = [], activeId = null, status = null, gen = null, live = null, tab = 'general', paintQueued = false;
const admin = {get: () => sessionStorage.getItem('tessel.admin') || '', set: v => sessionStorage.setItem('tessel.admin', v)};

function persist() {
  try { store().setItem('tessel.chats', JSON.stringify(chats.map(c => ({...c, messages: c.messages.map(m => ({...m, live: undefined}))})))); store().setItem('tessel.active', activeId || ''); }
  catch (e) { toast('Storage is full, download your chats to keep them'); }
}
function loadChats() {
  try { chats = JSON.parse(store().getItem('tessel.chats') || '[]'); } catch (e) { chats = []; }
  activeId = store().getItem('tessel.active');
  if (!chats.length) newChat(false);
  if (!chats.find(c => c.id === activeId)) activeId = chats[0].id;
}
const active = () => chats.find(c => c.id === activeId);

function applyTheme() {
  const dark = settings.theme === 'dark' || (settings.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.style.setProperty('--fs', {small: '14px', normal: '15.5px', large: '17px'}[settings.size]);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

function toast(msg) {
  $$('.toast').forEach(t => t.remove());
  const t = h('div', {class: 'toast'}, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 3200);
}

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function md(src) {
  const blocks = [];
  let t = src.replace(/```([\w+-]*)\n([\s\S]*?)```/g, (m, lang, code) => { blocks.push({lang, code}); return `\u0000${blocks.length - 1}\u0000`; });
  t = t.replace(/```([\w+-]*)\n([\s\S]*)$/, (m, lang, code) => { blocks.push({lang, code}); return `\u0000${blocks.length - 1}\u0000`; });
  t = esc(t);
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)"'<>]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = [];
  let list = null;
  const flush = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of t.split('\n')) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.+)$/))) { flush(); out.push(`<h${m[1].length + 1}>${m[2]}</h${m[1].length + 1}>`); }
    else if ((m = line.match(/^\s*[-*]\s+(.+)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${m[1]}</li>`); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.+)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${m[1]}</li>`); }
    else if (/^\u0000\d+\u0000$/.test(line.trim())) { flush(); out.push(line.trim()); }
    else if (line.trim() === '') { flush(); out.push(''); }
    else { flush(); out.push(line); }
  }
  flush();
  let html = out.join('\n').split(/\n{2,}|(?<=<\/(?:ul|ol|h\d)>)\n|\n(?=<(?:ul|ol|h\d))/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^<(ul|ol|h\d)/.test(p) || /^\u0000\d+\u0000$/.test(p)) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  return html.replace(/\u0000(\d+)\u0000/g, (m, i) => {
    const b = blocks[+i];
    return `<pre><div class="ch"><span>${esc(b.lang || 'code')}</span><button data-copy="${+i}">Copy</button></div><code>${esc(b.code.replace(/\n$/, ''))}</code></pre>`;
  }).replace(/<p><\/p>/g, '');
}

async function* sse(resp) {
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = '';
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      let ev = 'message', data = '';
      for (const l of block.split('\n')) {
        if (l.startsWith('event:')) ev = l.slice(6).trim();
        else if (l.startsWith('data:')) data += l.slice(5).trim();
      }
      if (data) yield {ev, data: JSON.parse(data)};
    }
  }
}

const METRIC_KEYS = ['set', 'ttft_ms', 'total_ms', 'queued_ms', 'prompt_tokens', 'completion_tokens', 'tok_per_s', 'prompt_ms', 'prompt_tok_per_s', 'max_tokens', 'ctx_limit'];

  if (!o || typeof o !== 'object' || !Array.isArray(o.messages)) return null;
  const msgs = [];
  for (const m of o.messages.slice(0, 400)) {
    if (!m || (m.role !== 'user' && m.role !== 'assistant') || typeof m.content !== 'string') continue;
    const clean = {role: m.role, content: m.content.slice(0, 20000)};
    if (typeof m.think === 'string') clean.think = m.think.slice(0, 20000);
    if (m.metrics && typeof m.metrics === 'object') {

async function importFiles(files) {
  let added = 0, bad = 0;

    try {

      const list = o && o.format === 'tessel-chats' && Array.isArray(o.chats) ? o.chats.slice(0, 200)

      if (!list.length) bad++;

  }
  if (added) { activeId = chats[0].id; persist(); render(); }
  toast(added ? `Imported ${added} chat${added > 1 ? 's' : ''}${bad ? `, skipped ${bad}` : ''}` : 'That file is not a Tessel chat export');

function buildContext(c, maxTok) {

  let trimmed = 0;
  if (settings.trim) while (msgs.length > 1 && estTokens(sys.concat(msgs)) + maxTok > lim) { msgs.shift(); trimmed++; }

async function generate(c) {
  const m = {role: 'assistant', content: '', think: '', metrics: null, live: true};
  c.messages.push(m);
  const cap = status ? status.limits.max_tokens_cap : 512;
  const maxTok = Math.min(settings.maxTokens, cap);
  const ctl = new AbortController();
  gen = {chat: c, m, ctl};
  render();
  const {msgs, trimmed} = buildContext(c, maxTok);
  m.trimmed = trimmed;
  let tokens = 0, firstAt = null, t0 = performance.now(), queued = false;
  const timer = setInterval(() => {
    if (!live || live.m !== m || queued) return;
    const el = (performance.now() - t0) / 1000, dec = firstAt ? (performance.now() - firstAt) / 1000 : 0;
    live.bar.style.width = Math.min(100, 100 * tokens / maxTok) + '%';
    live.txt.textContent = tokens ? `${tokens} of ${maxTok} tokens, ${el.toFixed(1)} s, ${dec > 0.5 ? (tokens / dec).toFixed(1) : '...'} tok/s` : `waiting for the first token, ${el.toFixed(1)} s`;
  }, 200);
  const paint = () => {
    paintQueued = false;
    if (!live || live.m !== m) return;
    live.body.innerHTML = md(m.content);
    if (m.think) {
      if (!live.think) { live.think = h('details', {class: 'think', open: ''}, h('summary', {}, 'Thinking'), h('div', {})); live.wrap.prepend(live.think); }
      live.think.querySelector('div').textContent = m.think;
    }
    const th = $('#thread');
    if (th.scrollHeight - th.scrollTop - th.clientHeight < 140) th.scrollTop = th.scrollHeight;
  };
  try {
    const r = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, signal: ctl.signal,
      body: JSON.stringify({messages: msgs, max_tokens: maxTok, temperature: settings.temperature, thinking: settings.thinking})});
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || r.statusText); }
    for await (const {ev, data} of sse(r)) {
      if (ev === 'token') {
        tokens = data.n; firstAt = firstAt || performance.now();
        if (data.kind === 'think') m.think += data.text; else m.content += data.text;
        if (!paintQueued) { paintQueued = true; requestAnimationFrame(paint); }
      } else if (ev === 'queue' && live && live.m === m) {
        queued = true;
        live.bar.style.width = '0%';
        live.txt.textContent = `Waiting in line, position ${data.position} of ${data.size}, about ${data.est_wait_s} s. ${data.sets_ready} of ${data.sets_total} replica sets ready.`;
      } else if (ev === 'start') { queued = false; t0 = performance.now(); }
      else if (ev === 'progress' && live && live.m === m && data.total) {
        live.bar.style.width = (100 * data.processed / data.total) + '%';
        live.txt.textContent = `Reading your message, ${data.processed} of ${data.total} tokens`;
      } else if (ev === 'done') m.metrics = data;
      else if (ev === 'error') throw new Error(data.message);
    }
  } catch (e) {
    if (e.name === 'AbortError') m.stopped = true; else m.error = e.message;
  } finally {
    clearInterval(timer);
    m.live = false; gen = null;
    c.updated = Date.now();
    persist(); render(); refresh();
  }
}

        check('remember', () => { const old = settings.remember ? sessionStorage : localStorage; old.removeItem('tessel.chats'); old.removeItem('tessel.active'); persist(); toast(settings.remember ? 'Chats will be kept in this browser' : 'Chats will end with this tab'); })));
  } else if (tab === 'gen') {
    const sys = h('textarea', {rows: 4, maxlength: 2000, placeholder: 'Optional instructions the model follows in every chat', oninput: e => { settings.system = e.target.value; saveSettings(); }});
    sys.value = settings.system;
    const cap = status ? status.limits.max_tokens_cap : 512;
    b.append(h('h3', {}, 'Generation'),
      field('System prompt', 'Sent with every message. Counts toward the context window.', sys, true),
      field('Max new tokens', `Up to ${cap} per reply`, slider('maxTokens', 16, cap, 16)),
      field('Temperature', 'Lower is more focused, higher is more varied', slider('temperature', 0, 1.5, 0.1)),
      field('Thinking mode', 'Lets the model reason first. Slower, often better for hard questions.', check('thinking')),
      field('Trim long chats automatically', 'Leaves out the oldest messages when a chat no longer fits the context window.', check('trim')));
  } else if (tab === 'data') {
    b.append(h('h3', {}, 'Data and privacy'),
      h('p', {class: 'kv'}, 'There are no accounts. Your chats are kept only in this browser. The server never stores them, it only sees the messages you send while a reply is generated. Downloading and uploading chats happens entirely in your browser.'),
      field('Download all chats', 'One file with every chat that has messages', h('button', {class: 'btn', onclick: exportAll}, 'Download')),
      field('Upload chats', 'A file saved from this site, one chat or a bundle', h('button', {class: 'btn', onclick: () => $('#file').click()}, 'Choose files')),
      field('Delete all chats', 'Removes every chat from this browser', h('button', {class: 'btn danger', onclick: () => { if (gen) return toast('Stop the reply first'); if (!confirm('Delete every chat in this browser?')) return; chats = []; newChat(false); persist(); render(); toast('All chats deleted'); }}, 'Delete all')));
  } else if (tab === 'cluster') buildCluster(b);
}

function buildCluster(b) {
  updateCluster.sig = null;
  const tok = h('input', {type: 'password', placeholder: 'Admin token', value: admin.get(), oninput: e => admin.set(e.target.value), autocomplete: 'off'});
  const types = h('input', {type: 'text', id: 'cl-type', list: 'cl-types', placeholder: 'Instance type, for example r7g.xlarge', autocomplete: 'off', spellcheck: 'false', oninput: () => { checkedSpec = null; fit(); }});
  const count = h('input', {type: 'number', id: 'cl-count', min: 1, max: 64, value: 4, title: 'workers per replica set', oninput: fit});
  const rep = h('input', {type: 'number', id: 'cl-rep', min: 1, max: 8, value: 1, title: 'replica sets', oninput: fit});
  const lim = h('input', {type: 'number', id: 'cl-limit', min: 2, max: 64, value: 9, title: 'most instances this cluster may run, head included', oninput: fit});
  const act = clAct = async (fn) => { try { await fn(); toast('Request sent'); $('#cl-msg').textContent = ''; } catch (e) { $('#cl-msg').textContent = e.message; } refresh(); };
  const checkType = async () => {
    try {
      const r = await fetch('/api/cluster/type?name=' + encodeURIComponent(types.value.trim()), {headers: {'X-Admin-Token': admin.get()}});
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || r.statusText);
      checkedSpec = d; $('#cl-msg').textContent = ''; fit();
    } catch (e) { checkedSpec = null; $('#cl-msg').textContent = e.message; }
  };
  const autoFill = () => {
    const c = status && status.cluster, m = status && status.models.find(x => x.id === selModel), t = specFor(types.value.trim());
    if (!c || !m || !t) { $('#cl-msg').textContent = 'Pick a model and check the node type first'; return; }
    const n = minWorkers(m, t);
    if (!n) { $('#cl-msg').textContent = `${t.type} has too little memory for ${m.name}`; return; }
    const top = Math.floor((+lim.value - c.rules.head) / n);
    count.value = n;
    if (top < 1) { lim.value = Math.min(c.max_instances_hard, n + c.rules.head); rep.value = 1; $('#cl-msg').textContent = `${m.name} needs ${n} workers plus the head. The limit box now shows ${lim.value}, press Save limit to keep it.`; }
    else { rep.value = top; $('#cl-msg').textContent = ''; }
    fit();
  };
  b.append(h('h3', {}, 'Cluster'),
    h('div', {id: 'cl-top', class: 'kv'}),
    h('div', {id: 'cl-sets'}),
    h('h4', {}, 'Admin controls'),
    h('p', {class: 'kv', style: 'margin:0 0 8px'}, 'Chatting needs no token. Loading models, changing nodes and the limit test are admin only.'),
    tok,
    h('h4', {}, 'Model'),
    h('div', {class: 'kv'}, 'Pick a model. Each card shows how many nodes of the current type it needs. Models are downloaded to the head node on demand.'),
    h('div', {id: 'cl-models'}),
    h('div', {class: 'rowg', id: 'cl-modelact', style: 'margin-top:8px'}),
    h('h4', {}, 'Nodes'),
    h('datalist', {id: 'cl-types'}),
    h('div', {class: 'rowg'}, types, h('button', {class: 'btn', onclick: checkType}, 'Check')),
    h('div', {class: 'kv', id: 'cl-spec', style: 'margin-top:4px'}, 'Any EC2 instance type works. Check looks up its memory and CPU.'),
    h('div', {class: 'rowg', style: 'margin-top:8px'}, count, rep,
      h('button', {class: 'btn', onclick: autoFill, title: 'workers needed for the selected model, and as many replica sets as the limit allows'}, 'Auto-fill'),
      h('button', {class: 'btn primary', onclick: () => { const c = status && status.cluster; const same = c && types.value.trim() === c.type && +count.value === c.count;
        if (!confirm(same ? 'This adds or removes replica sets. Existing sets keep serving. Continue?' : 'Changing the node type or workers per set stops everything, replaces all workers and reloads the model. Continue?')) return;
        act(() => post('/api/cluster/apply', {type: types.value.trim(), count: +count.value, replicas: +rep.value || 1, model: selModel})); }}, 'Apply')),
    h('div', {class: 'kv', style: 'margin-top:4px'}, 'Workers per set, replica sets. Auto-fill uses the selected model.'),
    h('div', {class: 'rowg', style: 'margin-top:8px'}, lim,
      h('button', {class: 'btn', onclick: () => act(() => post('/api/cluster/limit', {max_instances: +lim.value}))}, 'Save limit')),
    h('div', {class: 'kv', id: 'cl-limhint', style: 'margin-top:4px'}),
    h('div', {class: 'kv', id: 'cl-fit', style: 'margin-top:6px'}),
    h('div', {class: 'rowg', style: 'margin-top:8px'}, h('button', {class: 'btn', onclick: () => act(() => post('/api/cluster/replace', {}))}, 'Replace dead nodes now')),
    h('div', {class: 'pre', id: 'cl-job'}),
    h('div', {class: 'errtxt', id: 'cl-msg'}),
    h('h4', {}, 'Upper limit test'),
    h('div', {class: 'rowg'}, h('input', {type: 'text', id: 'bLevels', value: '1,2,4', title: 'concurrent users per step'}), h('input', {type: 'number', id: 'bDur', value: 30, min: 10, max: 120, title: 'seconds per step'}),
      h('button', {class: 'btn', id: 'benchBtn', onclick: runBench}, 'Run test')),
    h('div', {class: 'kv', style: 'margin-top:4px'}, 'Concurrent users per step, seconds per step. Spread across all ready replica sets.'),
    h('div', {id: 'benchOut'}));
  updateCluster();
}
let selModel = null, checkedSpec = null, clAct = null;
const specFor = name => { const c = status && status.cluster; return (checkedSpec && checkedSpec.type === name && checkedSpec) || (c && c.types.find(x => x.type === name)) || null; };
const minWorkers = (m, t) => {
  const r = status.cluster.rules, room = t.mem_gib * r.usable - r.overhead_gb;
  if (room <= 0) return null;
  const n = Math.max(1, Math.ceil(m.size_gb / room));
  return n <= m.n_layers ? n : null;
};
const fitCfg = () => {
  const c = status && status.cluster, m = status && status.models.find(x => x.id === selModel);
  const t = c && specFor($('#cl-type').value.trim());
  const n = +$('#cl-count').value, r = +$('#cl-rep').value || 1, lim = +$('#cl-limit').value;
  if (!c || !m) return '';
  if (!t) return 'Press Check to look up this instance type.';
  const need = m.size_gb / n + c.rules.overhead_gb, total = n * r + c.rules.head, min = minWorkers(m, t);
  let verdict = 'fits';
  if (!c.archs.includes(t.arch)) verdict = `no ${t.arch} worker build is published`;
  else if (!min) verdict = 'this node type has too little memory for the model';
  else if (n > m.n_layers) verdict = `the model only has ${m.n_layers} layers`;
  else if (total > lim) verdict = `${total} instances is over the limit of ${lim}`;
  else if (need > t.mem_gib * c.rules.usable) verdict = `does not fit in memory, use at least ${min} workers`;
  return `${m.name} on ${t.type} (${t.vcpu} vCPU, ${t.mem_gib} GiB): about ${need.toFixed(1)} GB per node, ${total} of ${lim} instances, needs at least ${min ?? '?'} workers per set: ${verdict}` +
    (verdict === 'fits' && n > c.rules.slow_above ? '. Many workers in a row slow every token, bigger nodes are faster.' : '');
};
function fit() {
  const f = $('#cl-fit'); if (f) f.textContent = fitCfg();
  const s = $('#cl-spec'), t = status && specFor($('#cl-type').value.trim());
  if (s && t) s.textContent = `${t.type}: ${t.vcpu} vCPU, ${t.mem_gib} GiB, ${t.arch}` + (checkedSpec && checkedSpec.supported === false ? ', no worker build for this CPU type' : '');
}

async function runBench() {
  const out = $('#benchOut');
  out.innerHTML = '<div class="kv" style="margin-top:8px">starting</div>';
  $('#benchBtn').disabled = true;
  const levels = $('#bLevels').value.split(',').map(x => +x.trim()).filter(Boolean);
  try {
    const r = await fetch('/api/bench', {method: 'POST', headers: {'X-Admin-Token': admin.get(), 'Content-Type': 'application/json'}, body: JSON.stringify({levels, duration_s: +$('#bDur').value})});
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || r.statusText); }
    let rows = '', summary = '';
    const draw = note => out.innerHTML = `<table><tr><th>users</th><th>total tok/s</th><th>per user</th><th>p50</th><th>p95</th><th>errors</th></tr>${rows}</table>${summary}<div class="kv" style="margin-top:6px">${note || ''}</div>`;
    for await (const {ev, data} of sse(r)) {
      if (ev === 'start') draw(`${data.sets} replica set${data.sets > 1 ? 's' : ''} under test`);
      else if (ev === 'running') draw(`running with ${data.concurrency} concurrent users`);
      else if (ev === 'step') { rows += `<tr><td>${data.concurrency}</td><td>${data.agg_tok_s}</td><td>${data.per_req_tok_s ?? '-'}</td><td>${data.lat_p50_s ?? '-'} s</td><td>${data.lat_p95_s ?? '-'} s</td><td>${data.errors}</td></tr>`; draw(); }
      else if (ev === 'done') { summary = `<div style="margin-top:8px"><b>Upper limit:</b> ${data.best_agg_tok_s} tok/s total at ${data.best_concurrency} concurrent users. More users stop helping at ${data.saturation_concurrency}.</div>`; draw(); }
    }
  } catch (e) { out.innerHTML = `<div class="errtxt">${e.message}</div>`; }
  const bb = $('#benchBtn'); if (bb) bb.disabled = false;
}

function updateCluster() {
  const s = status;
  if (!s || tab !== 'cluster' || !$('#cl-sets')) return;
  const nodeRow = n => h('div', {class: 'node'}, h('span', {class: 'dot' + (n.up ? ' ready' : '')}), n.name, h('span', {class: 'd kv'}, `${n.type || ''}${n.layers ? ', layers ' + n.layers : ''}`), h('span', {class: 'r'}, n.rtt_ms != null ? n.rtt_ms + ' ms' : n.up ? 'connected' : 'down'));
  $('#cl-top').textContent = `Head: cpu ${s.head.cpu_percent}%, memory ${s.head.mem_used_gb} of ${s.head.mem_total_gb} GB. ${s.stats.requests} replies, ${s.stats.tokens} tokens, ${s.stats.avg_tok_s ?? '-'} tok/s average, ${s.stats.errors} errors. Waiting line: ${s.limits.queue} of ${s.limits.queue_max}.`;
  $('#cl-sets').replaceChildren(...s.sets.map(x => h('div', {class: 'setbox'},
    h('div', {class: 'sh'}, h('span', {}, `Replica set ${x.id}`), h('span', {class: 'kv'}, x.state === 'loading' ? `loading ${Math.round((x.model.progress || 0) * 100)}%` : x.state + (x.active ? ', answering' : ''))),
    x.model.error ? h('div', {class: 'errtxt'}, x.model.error) : null,
    x.workers.map(nodeRow))));
  const cl = s.cluster;
  if (!selModel || !s.models.some(m => m.id === selModel)) selModel = (cl && cl.target_model) || (s.models[0] && s.models[0].id);
  const sig = JSON.stringify([selModel, s.models.map(m => [m.id, m.downloaded_gb, m.downloaded, m.running, m.fits_now, m.download, m.plan]), cl && [cl.type, cl.max_instances]]);
  if (updateCluster.sig !== sig) {
    updateCluster.sig = sig;
    $('#cl-models').replaceChildren(...s.models.map(m => {
      let note = '';
      if (m.plan) note = m.plan.ok ? `needs ${m.plan.workers} x ${cl.type} per set (about ${m.plan.per_node_gb} GB each), up to ${m.plan.max_replicas} set${m.plan.max_replicas > 1 ? 's' : ''} within the limit`
        : m.plan.reason + (m.plan.recommended_limit ? `, a limit of ${m.plan.recommended_limit} would allow it` : '');
      const dl = m.download && m.download.state === 'downloading' ? `downloading ${m.downloaded_gb} of ${m.size_gb} GB`
        : m.downloaded ? 'on disk' : m.downloaded_gb ? `partly downloaded, ${m.downloaded_gb} of ${m.size_gb} GB` : 'not downloaded';
      return h('div', {class: 'setbox mcard' + (m.id === selModel ? ' sel' : ''), onclick: () => { selModel = m.id; updateCluster.sig = null; updateCluster(); }},
        h('div', {class: 'sh'}, h('span', {}, m.name), h('span', {class: 'kv'}, m.running ? 'running' : m.fits_now === false ? 'needs more nodes' : '')),
        h('div', {class: 'kv'}, `${m.params} parameters, ${m.quant}, ${m.size_gb} GB, ${m.license}, ${dl}`),
        note ? h('div', {class: 'kv'}, note) : null,
        m.download && m.download.error ? h('div', {class: 'errtxt'}, m.download.error) : null);
    }));
    const m = s.models.find(x => x.id === selModel), busy = s.models.some(x => x.download && x.download.state === 'downloading');
    const dling = m && m.download && m.download.state === 'downloading';
    $('#cl-modelact').replaceChildren(
      !m ? '' : dling ? h('button', {class: 'btn', onclick: () => clAct(() => post('/api/models/download', {id: m.id, cancel: true}))}, 'Cancel download')
        : !m.downloaded ? h('button', {class: 'btn primary', disabled: busy, onclick: () => clAct(() => post('/api/models/download', {id: m.id}))}, m.downloaded_gb ? 'Resume download' : 'Download')
        : h('button', {class: 'btn primary', onclick: () => clAct(() => post('/api/models/load', {id: m.id}))}, 'Load on all replica sets'),
      h('button', {class: 'btn danger', onclick: () => clAct(() => post('/api/models/stop'))}, 'Stop'));
    if (cl) {
      $('#cl-types').replaceChildren(...cl.types.map(t => h('option', {value: t.type}, `${t.vcpu} vCPU, ${t.mem_gib} GiB, ${t.arch}`)));
      $('#cl-limhint').textContent = `Most instances the cluster may run, head included. Highest allowed: ${cl.max_instances_hard}. Each model card shows the limit it needs.`;
    }
  }
  const tin = $('#cl-type');
  if (cl && !updateCluster.init) { tin.value = cl.type || ''; $('#cl-count').value = cl.count; $('#cl-rep').value = cl.replicas; $('#cl-limit').value = cl.max_instances; updateCluster.init = true; }
  fit();
  const j = cl && cl.job;
  $('#cl-job').textContent = j && j.state !== 'idle' ? `${j.state}\n` + j.steps.slice(-6).join('\n') + (j.error ? '\n' + j.error : '') : '';
}

function openSettings(t) { tab = t || tab; updateCluster.init = false; $('#scrim').classList.add('on'); buildTab(); }
function closeSettings() { $('#scrim').classList.remove('on'); }

function renderStatus(s) {
  const st = s.model.state;
  $('#pdot').className = 'dot ' + st;
  $('#ptxt').textContent = st === 'ready' ? `${s.model.name}, ${s.model.sets_ready} of ${s.model.sets_total} replica set${s.model.sets_total > 1 ? 's' : ''} ready`
    : st === 'loading' ? `Loading ${s.model.name || 'model'} ${Math.round((s.model.progress || 0) * 100)}%` : st === 'waiting' ? 'Waiting to load' : st === 'error' ? 'Model error' : 'No model running';
  if (!gen && !$('#thread').querySelector('.col')) { const th = $('#thread'); if (th.querySelector('.empty')) { th.innerHTML = ''; th.append(emptyState()); } }
  updateComposer();
  updateCluster();
}
async function refresh() {
  try {
    const r = await fetch('/api/status');
    status = await r.json();
    renderStatus(status);
  } catch (e) { $('#pdot').className = 'dot error'; $('#ptxt').textContent = 'Offline'; }
}

function init() {
  $('#collapse').append(icon('side')); $('#expand').append(icon('side'));
  $('#newchat').append(icon('plus'), 'New chat');
  $('#searchico').append(icon('search'));
  $('#settingsBtn').append(icon('gear', 18));
  $('#importBtn').append(icon('up'), 'Upload');
  $('#exportAll').append(icon('down'), 'Download all');
  $('#exportOne').append(icon('down'));
  $('#closeSettings').append(icon('x'));
  $('#collapse').onclick = () => { $('#app').classList.add('collapsed'); $('#expand').style.display = ''; };
  $('#expand').onclick = () => { $('#app').classList.remove('collapsed'); $('#expand').style.display = 'none'; };
  $('#newchat').onclick = () => newChat();
  $('#search').oninput = renderList;
  $('#settingsBtn').onclick = () => openSettings('general');
  $('#pill').onclick = () => openSettings('cluster');
  $('#closeSettings').onclick = closeSettings;
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSettings(); });
  $$('.mnav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; updateCluster.init = false; buildTab(); });
  $('#importBtn').onclick = () => $('#file').click();
  $('#file').onchange = e => { importFiles([...e.target.files]); e.target.value = ''; };
  $('#exportAll').onclick = exportAll;
  $('#exportOne').onclick = e => { const c = active(); if (!c.messages.length) return toast('This chat is empty'); openMenu(e.currentTarget, [['down', 'Download as JSON', () => exportChat(c, 'json')], ['md', 'Download as Markdown', () => exportChat(c, 'md')]]); };
  $('#send').onclick = send;
  $('#input').addEventListener('input', autosize);
  $('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } else if (e.key === 'Escape' && gen) gen.ctl.abort(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });
  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-copy]');
    if (!b) return;
    navigator.clipboard.writeText(b.closest('pre').querySelector('code').textContent).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500); });
  });
  let depth = 0;
  addEventListener('dragenter', e => { if ([...(e.dataTransfer.types || [])].includes('Files')) { depth++; $('#drop').classList.add('on'); } });
  addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) $('#drop').classList.remove('on'); });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); depth = 0; $('#drop').classList.remove('on'); if (e.dataTransfer.files.length) importFiles([...e.dataTransfer.files]); });
  applyTheme();
  if (innerWidth <= 820) { $('#app').classList.add('collapsed'); $('#expand').style.display = ''; }
  loadChats();
  render();
  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 2000);
}
init();
</script>
</body>
</html>
